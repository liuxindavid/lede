name: Sync upstream lede

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions 使用 UTC 时间
    # 18:17 UTC = 北京时间 02:17
    - cron: '00 18 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync from upstream but keep local workflows
        run: |
          set -eux

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote remove upstream || true
          git remote add upstream https://github.com/coolsnowwolf/lede.git

          git fetch upstream --prune
          git fetch upstream --tags --force

          # 同步上游 master 分支，但保留你自己的 workflow
          git checkout upstream/master -- . ':(exclude).github/workflows'

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync upstream lede"
          fi

          git push origin HEAD:main
          git push origin --tags --force
